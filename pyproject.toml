[project]
name = "financial_reports"
authors = [
    { name = "VerityCore Consultancy (Pvt) Ltd", email = "devs@veritycore.co.zw" }
]
description = "IFRS 18 compliant statutory and management financial reporting for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

